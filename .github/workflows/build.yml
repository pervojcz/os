name: Build
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "05 10 * * *" # 10:05am UTC everyday
  push:
    branches:
      - main
    tags:
      - "*"
    paths-ignore:
      - "**/README.md"
  workflow_dispatch:

env:
  IMAGE_PREFIX: "${{ github.event.repository.name }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  GH_REPO: "${{ github.repository }}"
  GH_REF_TYPE: "${{ github.ref_type }}"
  GH_REF_NAME: "${{ github.ref_name }}"
  GH_PR: "${{ github.event.number }}"

jobs:
  prepare:
    name: Compile script and get list of variants
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      variants: ${{ steps.json.outputs.variants }}
      nvidiaVariants: ${{ steps.json.outputs.nvidiaVariants }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Compile script
        run: bun run build

      - name: Upload script artifact
        uses: actions/upload-artifact@v7
        with:
          name: osbuilder
          path: dist
          retention-days: 1

      - name: Get list of variants
        id: json
        run: |
          output=$(dist/osbuilder list-variants)
          echo "variants=$output" >> $GITHUB_OUTPUT

          output=$(dist/osbuilder -n list-variants)
          echo "nvidiaVariants=$output" >> $GITHUB_OUTPUT

  build:
    name: Build and push image
    runs-on: blacksmith-4vcpu-ubuntu-2404

    permissions:
      contents: read
      packages: write
      id-token: write

    needs: prepare
    strategy:
      matrix:
        variant: ${{ fromJson(needs.prepare.outputs.variants) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download script artifact
        uses: actions/download-artifact@v8
        with:
          name: osbuilder
          path: dist

      - name: Make script executable
        run: chmod +x dist/osbuilder

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3
        with:
          # Pin for bootc / containers-image sigstore attachment compatibility
          cosign-release: v2.6.3

      - name: Log in to container registry
        uses: redhat-actions/podman-login@v2
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull and inspect base image
        id: pull
        run: |
          base_image=$(dist/osbuilder get-base-image ${{ matrix.variant }})
          podman pull "$base_image"
          inspect=$(podman inspect "$base_image" | jq -r 'tostring')
          echo "base_image=$base_image" >> $GITHUB_OUTPUT
          echo "inspect=$inspect" >> $GITHUB_OUTPUT

      - name: Generate base image tags
        id: tags
        run: |
          tags=""

          if [[ -z "${{ env.GH_PR }}" ]]; then
            tags="${tags}\nlatest"
          else
            tags="${tags}\npr-${{ env.GH_PR }}"
          fi

          if [[ "${{ env.GH_REF_TYPE }}" == "tag" ]]; then
            tags="${tags}\n${{ env.GH_REF_NAME }}"
          fi

          echo "tags=$tags" >> $GITHUB_OUTPUT

      - name: Generate main image Containerfile
        id: containerfile-main
        run: |
          containerfile_path="Containerfile.${{ matrix.variant }}"
          dist/osbuilder generate-containerfile ${{ matrix.variant }} -r ${{ env.IMAGE_REGISTRY }} > "$containerfile_path"
          echo "containerfile=$containerfile_path" >> $GITHUB_OUTPUT

      - name: Generate main image tags
        id: tags-main
        env:
          IMAGE_PATH: "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.variant }}"
          BASE_TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          tags=$(echo -e "$BASE_TAGS" | awk -v prefix="$IMAGE_PATH:" 'NF {print prefix $0}' | tr "\n" " ")
          echo "tags=$tags" >> $GITHUB_OUTPUT

      - name: Build main image
        id: build-main
        uses: redhat-actions/buildah-build@v3
        with:
          context: .
          containerfiles: ${{ steps.containerfile-main.outputs.containerfile }}
          tags: ${{ steps.tags-main.outputs.tags }}
          extra-args: --skip-unused-stages=false
          build-args: CHUNKAH_CONFIG_STR=${{ steps.pull.outputs.inspect }}

      - name: Push main image
        id: push-main
        uses: redhat-actions/push-to-registry@v3
        with:
          tags: ${{ steps.tags-main.outputs.tags }}

      - name: Sign main image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_PATH: "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.variant }}"
          DIGEST: ${{ steps.build-main.outputs.digest }}
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          cosign sign -y --recursive --key env://COSIGN_PRIVATE_KEY "${{ env.IMAGE_PATH }}@${DIGEST}"

      - name: Generate Containerfile for image with NVIDIA drivers
        if: ${{ contains(fromJson(needs.prepare.outputs.nvidiaVariants), matrix.variant) }}
        id: containerfile-nvidia
        env:
          DIGEST: ${{ steps.build-main.outputs.digest }}
        run: |
          containerfile_path="Containerfile.${{ matrix.variant }}-nvidia"
          dist/osbuilder -n generate-containerfile ${{ matrix.variant }} -r ${{ env.IMAGE_REGISTRY }} -d ${{ env.DIGEST }} > "$containerfile_path"
          echo "containerfile=$containerfile_path" >> $GITHUB_OUTPUT

      - name: Generate tags for image with NVIDIA drivers
        if: ${{ contains(fromJson(needs.prepare.outputs.nvidiaVariants), matrix.variant) }}
        id: tags-nvidia
        env:
          IMAGE_PATH: "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.variant }}-nvidia"
          BASE_TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          tags=$(echo -e "$BASE_TAGS" | awk -v prefix="$IMAGE_PATH:" 'NF {print prefix $0}' | tr "\n" " ")
          echo "tags=$tags" >> $GITHUB_OUTPUT

      - name: Build image with NVIDIA drivers
        if: ${{ contains(fromJson(needs.prepare.outputs.nvidiaVariants), matrix.variant) }}
        id: build-nvidia
        uses: redhat-actions/buildah-build@v3
        with:
          context: .
          containerfiles: ${{ steps.containerfile-nvidia.outputs.containerfile }}
          tags: ${{ steps.tags-nvidia.outputs.tags }}
          extra-args: --skip-unused-stages=false
          build-args: CHUNKAH_CONFIG_STR=${{ steps.pull.outputs.inspect }}

      - name: Push image with NVIDIA drivers
        if: ${{ contains(fromJson(needs.prepare.outputs.nvidiaVariants), matrix.variant) }}
        id: push-nvidia
        uses: redhat-actions/push-to-registry@v3
        with:
          tags: ${{ steps.tags-nvidia.outputs.tags }}

      - name: Sign image with NVIDIA drivers
        if: ${{ github.event_name != 'pull_request' && contains(fromJson(needs.prepare.outputs.nvidiaVariants), matrix.variant) }}
        env:
          IMAGE_PATH: "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.variant }}-nvidia"
          DIGEST: ${{ steps.build-nvidia.outputs.digest }}
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          cosign sign -y --recursive --key env://COSIGN_PRIVATE_KEY "${{ env.IMAGE_PATH }}@${DIGEST}"
