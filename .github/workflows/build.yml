name: Build
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "05 10 * * *" # 10:05am UTC everyday
  push:
    branches:
      - main
    tags:
      - "*"
    paths-ignore:
      - "**/README.md"
  workflow_dispatch:

env:
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  GH_REPO: "${{ github.repository }}"
  GH_REF_TYPE: "${{ github.ref_type }}"
  GH_REF_NAME: "${{ github.ref_name }}"
  GH_PR: "${{ github.event.number }}"

jobs:
  prepare:
    name: Compile script and get list of variants
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      variants: ${{ steps.json.outputs.variants }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Compile script
        run: bun run build

      - name: Upload script artifact
        uses: actions/upload-artifact@v7
        with:
          name: osbuilder
          path: dist/osbuilder
          retention-days: 1

      - name: Get list of variants
        id: json
        run: |
          output=$(dist/osbuilder list-variants)
          echo "variants=$output" >> $GITHUB_OUTPUT

  build:
    name: Build and push image
    runs-on: blacksmith-4vcpu-ubuntu-2404

    permissions:
      contents: read
      packages: write
      id-token: write

    needs: prepare
    strategy:
      matrix:
        variant: ${{ fromJson(needs.prepare.outputs.variants) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download script artifact
        uses: actions/download-artifact@v8
        with:
          name: osbuilder
          path: dist/osbuilder

      - name: Generate Containerfile
        id: containerfile
        run: |
          containerfile_path="Containerfile.${{ matrix.variant }}"
          dist/osbuilder generate-containerfile ${{ matrix.variant }} -r ${{ env.IMAGE_REGISTRY }} > "$containerfile_path"
          echo "containerfile=$containerfile_path" >> $GITHUB_OUTPUT

      - name: Generate image tags
        id: tags
        run: |
          image_path="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.variant }}"

          tags=""

          if [[ -z "${{ env.GH_PR }}" ]]; then
            tags="${tags}\n${image_path}:latest"
          else
            tags="${tags}\n${image_path}:pr-${{ env.GH_PR }}"
          fi

          if [[ "${{ env.GH_REF_TYPE }}" == "tag" ]]; then
            tags="${tags}\n${image_path}:${{ env.GH_REF_NAME }}"
          fi

          echo 'tags="$tags"' >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ steps.containerfile.outputs.containerfile }}
          push: true
          tags: ${{ fromJSON(steps.tags.outputs.tags) }}

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3
        with:
          # Pin for bootc / containers-image sigstore attachment compatibility
          cosign-release: v2.6.3

      - name: Sign image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          set -euo pipefail
          image_registry="${IMAGE_REGISTRY,,}"
          image_name="${IMAGE_NAME,,}"
          cosign sign -y --key env://COSIGN_PRIVATE_KEY \
            "${image_registry}/${image_name}-${{ matrix.variant }}@${DIGEST}"
